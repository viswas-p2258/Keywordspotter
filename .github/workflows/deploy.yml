name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: keyword-spotting-app
  IMAGE_TAG: ${{ github.sha }}
  AWS_ROLE_TO_ASSUME: arn:aws:iam::696073197777:role/KWS-GitHub-Deploy
  STACK_NAME: keyword-spotting-app

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Debug GitHub OIDC Token claims
        run: |
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_REF: ${GITHUB_REF}"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "WARNING: ACTIONS_ID_TOKEN_REQUEST_URL is not set."
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is available."
            RAW_RESP=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
            RAW_JWT=$(echo "$RAW_RESP" | jq -r '.value // empty')
            if [ -n "$RAW_JWT" ]; then
              PAYLOAD=$(echo "$RAW_JWT" | cut -d. -f2)
              pad=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
              for i in $(seq 1 $pad); do PAYLOAD="${PAYLOAD}="; done
              echo "Decoded OIDC Claims:"
              echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref}' || true
            else
              echo "Raw token response: $RAW_RESP"
            fi
          fi

      - name: Determine AWS credential method
        id: auth-mode
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
        run: |
          if [ -n "${KEY_ID:-}" ]; then
            echo "use_keys=true" >> "$GITHUB_OUTPUT"
            echo "Configuring AWS deployment using Access Keys."
          else
            echo "use_keys=false" >> "$GITHUB_OUTPUT"
            echo "Configuring AWS deployment using GitHub OIDC."
          fi

      - name: Configure AWS credentials using Access Keys
        if: steps.auth-mode.outputs.use_keys == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_KEY }}

      - name: Configure AWS credentials using GitHub OIDC
        if: steps.auth-mode.outputs.use_keys != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          audience: sts.amazonaws.com

      - name: Verify assumed AWS identity
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$account_id" != "696073197777" ]]; then
            echo "::error::GitHub OIDC assumed an unexpected AWS account: ${account_id}."
            exit 1
          fi

      - name: Ensure ECR repository exists
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build Lambda container image
        run: |
          docker build \
            --tag "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" \
            --tag "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Deploy Lambda stack
        run: |
          set -euo pipefail
          image_uri="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          aws cloudformation deploy \
            --template-file infra/lambda-stack.yml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides ImageUri="$image_uri"
          app_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue | [0]" \
            --output text)
          if [[ -z "$app_url" || "$app_url" == "None" ]]; then
            echo "::error::CloudFormation did not return a Lambda Function URL."
            exit 1
          fi
          health_url="${app_url%/}/health"
          echo "Checking application health at: ${health_url}"
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error -L "$health_url"; then
              echo
              echo "Deployment verified successfully! Live application: ${app_url}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The Lambda application's /health endpoint did not return HTTP 2xx."
          exit 1
