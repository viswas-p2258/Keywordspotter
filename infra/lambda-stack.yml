AWSTemplateFormatVersion: "2010-09-09"
Description: Public Lambda-hosted speech transcription app with private temporary S3 uploads.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI for the Lambda container.

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - POST
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTemporaryAudio
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
          - Id: DeleteTranscriptionResults
            Status: Enabled
            Prefix: transcripts/
            ExpirationInDays: 1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TemporaryAudioBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${UploadBucket.Arn}/uploads/*"
        - PolicyName: StartAndReadTranscriptionJobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - transcribe:StartTranscriptionJob
                  - transcribe:GetTranscriptionJob
                Resource: !Sub "arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${UploadBucket.Arn}/transcripts/*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt TranscribeDataAccessRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: transcribe.amazonaws.com

  TranscribeDataAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - transcribe.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: TranscribeS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${UploadBucket.Arn}/uploads/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${UploadBucket.Arn}/transcripts/*"

  TranscriptionFunction:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          MAX_UPLOAD_BYTES: "67108864"
          TRANSCRIBE_DATA_ACCESS_ROLE_ARN: !GetAtt TranscribeDataAccessRole.Arn
          TRANSCRIBE_LANGUAGE_CODE: en-US
          PORT: "5000"

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt TranscriptionFunction.Arn

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref TranscriptionFunction
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermissionForInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TranscriptionFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: Public URL for the speech transcription app.
    Value: !GetAtt FunctionUrl.FunctionUrl
